<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeadMapper</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <h1>LeadMapper</h1>
    <p id="status" role="status">Carregando…</p>
    <dl id="counters" class="counters" hidden>
      <div><dt>Encontrados</dt><dd id="count-found">0</dd></div>
      <div><dt>Processados</dt><dd id="count-processed">0</dd></div>
      <div><dt>Com telefone</dt><dd id="count-phone">0</dd></div>
      <div><dt>Com e-mail</dt><dd id="count-email">0</dd></div>
      <div><dt>Com WhatsApp</dt><dd id="count-whatsapp">0</dd></div>
      <div><dt>Sites visitados</dt><dd id="count-sites">0</dd></div>
      <div><dt>Já coletados (pulados)</dt><dd id="count-skipped">0</dd></div>
      <div><dt>Duplicados removidos</dt><dd id="count-duplicates">0</dd></div>
      <div><dt>Erros</dt><dd id="count-failures">0</dd></div>
    </dl>
    <p id="total" class="total"></p>
    <section id="export-section" class="export" hidden>
      <label>
        Exportar
        <select id="export-scope">
          <option value="all">Toda a lista</option>
          <option value="current">Só a busca atual</option>
        </select>
      </label>
      <label class="checkbox">
        <input id="discard-no-contact" type="checkbox" />
        Descartar leads sem nenhum contato
      </label>
      <div class="actions">
        <button id="export" type="button">Exportar CSV</button>
        <button id="clear" type="button">Limpar lista</button>
      </div>
    </section>
    <section id="options" class="options">
      <label>
        Máximo de empresas por coleta
        <input id="limit" type="number" min="1" max="500" step="1" value="120" />
      </label>
      <label>
        Velocidade
        <select id="speed">
          <option value="slow">Lenta</option>
          <option value="normal" selected>Normal</option>
          <option value="fast">Rápida</option>
        </select>
      </label>
      <label class="checkbox">
        <input id="enrich-sites" type="checkbox" checked />
        Buscar e-mail e WhatsApp nos sites
      </label>
    </section>
    <div class="actions">
      <button id="start" type="button" disabled>Iniciar coleta</button>
      <button id="pause" type="button" hidden>Pausar</button>
      <button id="resume" type="button" hidden>Retomar</button>
      <button id="cancel" type="button" hidden>Cancelar</button>
    </div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
