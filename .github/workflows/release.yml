name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag da release (ex.: v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # o script "package" usa tar -a (bsdtar do Windows); no Linux usa zip
      - run: cd dist && zip -r ../leadmapper.zip .
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.tag }}" leadmapper.zip --target "${{ github.sha }}" --generate-notes
