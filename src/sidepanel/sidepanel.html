<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="sidepanelTitle">Leads · LeadMapper</title>
    <link rel="stylesheet" href="./sidepanel.css" />
  </head>
  <body>
    <main>
      <header>
        <h1 data-i18n="leadsHeading">Leads</h1>
        <p id="summary" role="status"></p>
      </header>

      <search id="filters" class="filters" aria-label="Filtros da lista" data-i18n-aria-label="filtersLabel">
        <label class="wide">
          <span data-i18n="searchLabel">Buscar</span>
          <input id="text" type="search" placeholder="nome, bairro, telefone, e-mail, tag" data-i18n-placeholder="searchPlaceholder" autocomplete="off" />
        </label>
        <label>
          <span data-i18n="originSearchLabel">Busca de origem</span>
          <select id="search"></select>
        </label>
        <label>
          <span data-i18n="statusLabel">Status</span>
          <select id="status"></select>
        </label>
        <label>
          <span data-i18n="sortLabel">Ordenar por</span>
          <select id="sort">
            <option value="recentes" data-i18n="sortRecent">Mais recentes</option>
            <option value="nome" data-i18n="sortName">Nome (A–Z)</option>
            <option value="nota" data-i18n="sortRating">Nota</option>
            <option value="avaliacoes" data-i18n="sortReviews">Avaliações</option>
          </select>
        </label>
        <label class="checkbox">
          <input id="only-contact" type="checkbox" />
          <span data-i18n="onlyWithContact">Só com contato</span>
        </label>
      </search>

      <section class="bulk" aria-label="Ações na lista" data-i18n-aria-label="bulkLabel">
        <label class="checkbox">
          <input id="select-all" type="checkbox" />
          <span id="select-all-label">Selecionar os filtrados</span>
        </label>
        <div class="bulk-row">
          <label>
            <span data-i18n="markAs">Marcar como</span>
            <select id="bulk-status"></select>
          </label>
          <button id="apply-status" type="button" data-i18n="apply">Aplicar</button>
        </div>
        <div class="bulk-row">
          <label>
            <span data-i18n="exportLabel">Exportar</span>
            <select id="export-format">
              <option value="csv-generic" data-i18n="formatCsvGeneric">CSV genérico (CRM)</option>
              <option value="csv-google" data-i18n="formatCsvGoogle">CSV para Google Contatos</option>
              <option value="csv" data-i18n="formatCsv">CSV (Excel)</option>
              <option value="json" data-i18n="formatJson">JSON</option>
              <option value="vcf" data-i18n="formatVcard">vCard (contatos)</option>
            </select>
          </label>
          <button id="export" type="button" data-i18n="exportLabel">Exportar</button>
        </div>
        <button id="remove" type="button" class="danger" data-i18n="removeSelected">Remover selecionados</button>
      </section>

      <div class="table-wrapper">
        <table>
          <caption class="visually-hidden" data-i18n="tableCaption">Leads coletados</caption>
          <thead>
            <tr>
              <th scope="col" data-i18n="colCompany">Empresa</th>
              <th scope="col" data-i18n="colPhone">Telefone</th>
              <th scope="col" data-i18n="colEmail">E-mail</th>
              <th scope="col" data-i18n="statusLabel">Status</th>
              <th scope="col" data-i18n="colTags">Tags</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p id="empty" class="empty" data-i18n="noLeadsWithFilters" hidden>Nenhum lead com esses filtros.</p>
      <button id="more" type="button" hidden>Mostrar mais</button>
    </main>

    <dialog id="confirm-remove" closedby="any" aria-labelledby="confirm-remove-title">
      <form method="dialog">
        <h2 id="confirm-remove-title" data-i18n="removeTitle">Remover leads?</h2>
        <p id="confirm-remove-text"></p>
        <div class="actions">
          <button type="submit" value="cancel" data-i18n="cancel" autofocus>Cancelar</button>
          <button type="submit" value="remove" class="danger" data-i18n="remove">Remover</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./sidepanel.ts"></script>
  </body>
</html>
