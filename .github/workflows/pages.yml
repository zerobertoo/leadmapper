name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, docs/media/**, brand/logo.svg, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # reaproveita a mídia e o logo do repositório, sem duplicar arquivos em site/
      - run: |
          mkdir -p site/media
          cp docs/media/* site/media/
          cp brand/logo.svg site/logo.svg
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
